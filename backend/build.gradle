plugins {
	id 'java'
	id 'org.springframework.boot' version '3.3.5'
	id 'io.spring.dependency-management' version '1.1.6'
	id 'application'
	
}
// mainClassName = 'BackendApplication'
// sourceCompatibility = 11
// targetCompatibility = 11
// version = '1.0'


group = 'com.bookclub'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// implementation 'org.springframework.boot:spring-boot-starter-security' // Spring Security
	implementation 'com.google.firebase:firebase-admin:9.4.2'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'

	implementation 'io.jsonwebtoken:jjwt-api:0.11.2'
	implementation 'io.jsonwebtoken:jjwt-impl:0.11.2'
	implementation 'io.jsonwebtoken:jjwt-jackson:0.11.2'

	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.0.2'	//Swagger
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client' // OAuth2 Client

	implementation 'javax.annotation:javax.annotation-api:1.3.2'
	implementation 'org.springframework.boot:spring-boot-starter-mail'

	// implementation 'com.google.api-client:google-api-client:2.0.0'
    // implementation 'com.google.oauth-client:google-oauth-client-jetty:1.34.1'
    // implementation 'com.google.apis:google-api-services-calendar:v3-rev20220715-2.0.0'
	// implementation 'com.google.http-client:google-http-client-jackson2:1.41.6'
	// Google Meet API 관련 의존성
    // implementation 'com.google.api:gax:1.73.0'
    // implementation 'com.google.api:gax-grpc:1.73.0'
    // implementation 'com.google.apps:google-apps-meet-v2:2.0.0' // Google Meet API
    // implementation 'com.google.auth:google-auth-library-oauth2-http:1.19.0' // OAuth2 인증
    // implementation 'com.google.api-client:google-api-client:2.2.0'
    // implementation 'com.google.oauth-client:google-oauth-client-jetty:1.34.1'
    // implementation 'com.google.http-client:google-http-client-jackson2:1.41.6'

	// Google Calendar API (for Meet link generation)
	implementation 'com.google.api-client:google-api-client:2.2.0'
	implementation 'com.google.apis:google-api-services-calendar:v3-rev20231123-2.0.0'
	implementation 'com.google.auth:google-auth-library-oauth2-http:1.19.0'
	implementation 'com.google.http-client:google-http-client-jackson2:1.43.3'

	// implementation 'javax.servlet:javax.servlet-api:4.0.1'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	
	//	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	//	implementation 'org.mongodb:mongodb-driver-sync:5.2.0'
}



tasks.named('test') {
	useJUnitPlatform()
}
